# Render Blueprint — deploys the web app as a Docker service.
# The checkpoint is NOT in this repo (too large); app.py downloads it at
# startup from the GitHub Release asset named by WEIGHTS_URL.
services:
  - type: web
    name: deepfake-detection-cnn
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: WEIGHTS_URL
        value: https://github.com/Harsh10172005/Deepfake-Detection-CNN/releases/download/v1.0/best_cnn_efficientnet_b0.pth
